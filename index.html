<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Admin</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
body {
  background: linear-gradient(135deg, #1f4037, #99f2c8);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 50px;
  font-family: "Segoe UI", sans-serif;
}

/* GLASS CARD */
.dashboard {
  width: 520px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  animation: fadeUp 0.7s ease;
}

@keyframes fadeUp {
  from {opacity:0; transform: translateY(30px);}
  to {opacity:1; transform: translateY(0);}
}

/* HEADER */
.header {
  background: linear-gradient(90deg, #ff512f, #dd2476);
  color: white;
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* INPUT */
.form-control {
  border-radius: 30px;
  padding: 12px 18px;
  border: 1px solid #ddd;
}
.form-control:focus {
  box-shadow: 0 0 15px rgba(221,36,118,0.5);
  border-color: #dd2476;
}

/* BUTTONS */
.btn-pill {
  border-radius: 30px;
  padding: 10px 22px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  transition: all 0.25s ease;
}
.btn-pill:hover {
  transform: translateY(-3px) scale(1.05);
}

/* MOVIE LIST */
#lstMovies {
  border-radius: 15px;
  padding: 10px;
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.15);
}
#lstMovies option {
  padding: 8px;
  font-weight: 600;
}

/* COUNT LABEL */
.count {
  margin-top: 10px;
  font-weight: bold;
  color: #444;
}

/* MODAL */
.modal-content {
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}
.modal-header {
  background: linear-gradient(90deg, #ff512f, #dd2476);
  color: white;
  border-radius: 20px 20px 0 0;
}
</style>

<script>
let movies = ["CHAAVA", "CAPTAIN AMERICA"];
let editIndex = -1;
let editModal;

function LoadMovies() {
  lstMovies.innerHTML = "";
  movies.forEach(m => {
    let opt = document.createElement("option");
    opt.text = m;
    opt.value = m;
    lstMovies.appendChild(opt);
  });
  lblCount.innerText = `🎥 Total Movies : ${movies.length}`;
}

function AddClick() {
  let movie = txtMovie.value.trim().toUpperCase();
  if (!movie) return alert("Enter movie name");
  if (movies.includes(movie)) return alert("Movie already exists");

  movies.push(movie);
  txtMovie.value = "";
  LoadMovies();
}

function EditClick() {
  if (!lstMovies.value) return alert("Select a movie");
  editIndex = movies.indexOf(lstMovies.value);
  txtEditMovie.value = lstMovies.value;
  editModal.show();
}

function SaveClick() {
  let name = txtEditMovie.value.trim().toUpperCase();
  if (!name) return alert("Name required");
  movies[editIndex] = name;
  LoadMovies();
  editModal.hide();
}

function RemoveClick() {
  if (!lstMovies.value) return alert("Select movie");
  movies.splice(movies.indexOf(lstMovies.value), 1);
  LoadMovies();
}

function ClearAll() {
  movies = [];
  LoadMovies();
}

window.onload = () => {
  LoadMovies();
  editModal = new bootstrap.Modal(editModalBox);
};
</script>
</head>

<body>

<div class="dashboard">
  <div class="header">
    <h3><i class="bi bi-film"></i> BookMyShow Admin</h3>
  </div>

  <div class="input-group mb-3">
    <input id="txtMovie" class="form-control" placeholder="Enter movie name">
    <button class="btn btn-primary btn-pill ms-2" onclick="AddClick()">
      <i class="bi bi-plus-lg"></i> Add
    </button>
  </div>

  <label class="fw-bold">🎬 Movies List</label>
  <select id="lstMovies" size="4" class="form-select mb-2"></select>
  <div id="lblCount" class="count"></div>

  <div class="d-flex gap-2 mt-3 flex-wrap">
    <button class="btn btn-warning btn-pill" onclick="EditClick()">
      <i class="bi bi-pencil-fill"></i> Edit
    </button>
    <button class="btn btn-danger btn-pill" onclick="RemoveClick()">
      <i class="bi bi-trash-fill"></i> Remove
    </button>
    <button class="btn btn-outline-danger btn-pill" onclick="ClearAll()">
      Clear All
    </button>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="editModalBox">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Edit Movie</h5>
      </div>
      <div class="modal-body">
        <input id="txtEditMovie" class="form-control">
      </div>
      <div class="modal-footer">
        <button class="btn btn-success btn-pill" onclick="SaveClick()">Save</button>
        <button class="btn btn-secondary btn-pill" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
